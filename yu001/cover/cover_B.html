<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800;900&display=swap">
<style>
:root{--cyan:#16a9e6;--navy:#0a2440;--yellow:#ffd23f;--red:#ff4b3e}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:"Lexend","Arial Black",sans-serif;background:#000}
.c{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,18,32,.55) 0%,rgba(6,18,32,0) 22%,rgba(6,18,32,0) 48%,rgba(6,18,32,.88) 72%,rgba(6,18,32,.95) 100%)}
.logo{position:absolute;top:120px;left:50%;transform:translateX(-50%);height:64px;background:rgba(10,36,64,.8);padding:16px 34px;border-radius:99px;box-sizing:content-box}
.h{position:absolute;left:64px;right:64px;bottom:430px;color:#fff;text-transform:uppercase;font-weight:900;line-height:.98;letter-spacing:-.01em;text-shadow:0 6px 24px rgba(0,0,0,.5)}
.h .s{display:inline-block;font-size:62px;font-weight:800;color:var(--yellow);margin-bottom:14px;letter-spacing:.01em}
.h .b{display:block;font-size:118px}
.h em{font-style:normal;color:var(--cyan)}
.h .hl{display:inline-block;background:var(--yellow);color:#1b1500;padding:2px 22px 8px;border-radius:18px;transform:rotate(-2deg);margin-top:16px;text-shadow:none}
.card{position:absolute;right:56px;top:860px;width:400px;border-radius:22px;overflow:hidden;border:8px solid #fff;transform:rotate(6deg);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.card img{display:block;width:100%}
.stamp{position:absolute;right:70px;top:1060px;transform:rotate(-10deg);border:10px solid var(--red);color:var(--red);background:rgba(255,255,255,.94);font-weight:900;font-size:58px;padding:6px 26px;border-radius:16px;letter-spacing:.04em}
.sub{position:absolute;left:64px;right:64px;bottom:300px;color:#cfe9f5;font-weight:600;font-size:44px}
</style>
<div class="c">
  <img class="bg" src="bgB.png">
  <div class="shade"></div>
  <img class="logo" src="logo_white.png">
<div class="h"><span class="s">Ustaz &amp; Ustazah KAFA</span><span class="b">Tak pandai<br><span class="hl">akaun?</span></span></div>
<div class="sub">Tonton ni sebelum kutip yuran lagi</div>
</div>

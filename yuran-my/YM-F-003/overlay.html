<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Overlay YM-F-003. Koordinat reka 1080x1920; ?scale=0.5 untuk preview 540x960. Font rasmi Acumin Pro tiada -> Inter */
:root{--biru:#2A3B8F;--aksen:#29ABE2;--hitam:#231F20;--kelabu:#E7E8E9;--putih:#FFFFFF;--merah:#D9434B}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;font-family:Inter,"Source Sans 3",sans-serif;color:var(--hitam)}
.abs{position:absolute}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.cap{position:absolute;left:60px;width:860px;top:1250px;text-align:center;font-weight:800;font-size:80px;line-height:1.08;color:#fff;
  -webkit-text-stroke:12px var(--hitam);paint-order:stroke fill;text-shadow:0 6px 18px rgba(0,0,0,.45);letter-spacing:-.5px}
.cap .hot{color:var(--aksen)}
.card{position:absolute;background:rgba(255,255,255,.96);border-radius:30px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:26px 30px;box-sizing:border-box}
.pill{position:absolute;border-radius:999px;font-weight:700;white-space:nowrap}
.chip{position:absolute;left:460px;top:1060px;transform-origin:50% 50%;display:flex;align-items:center;gap:22px;background:#fff;border-radius:999px;
  padding:22px 40px 22px 26px;box-shadow:0 14px 40px rgba(0,0,0,.2);font-weight:700;font-size:46px;white-space:nowrap}
.ic{width:72px;height:72px;border-radius:50%;background:var(--biru);display:flex;align-items:center;justify-content:center;flex:none}
</style></head>
<body><div id="stage"></div>
<script>
const P = window.PLAN;           // diisi oleh render.js / preview
const S = document.getElementById('stage');
const sc = +(new URLSearchParams(location.search).get('scale') || 1);
S.style.transform = `scale(${sc})`;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - cl(x), 3);                       // ease-out
const eio = x => (x = cl(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = x => { x = cl(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// fade in/out pada sempadan elemen
const io = (t, g, a = .22, b = .22) => cl((t - g.s) / a) * cl((g.e - t) / b);

const svg = {
  person: c => `<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`,
  check: (c, s = 44) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  cross: (c, s = 44) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  book: `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M4 4h11a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M4 17a3 3 0 013-3h11"/><path d="M8 8h6"/></svg>`,
  'receipt-x': `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>`,
  phone: `<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>`,
  mag: `<svg width="190" height="190" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5l6 6"/></svg>`,
  hand: `<svg width="120" height="120" viewBox="0 0 24 24"><path d="M9 11V4.5a1.5 1.5 0 013 0V10l5.2 1.1a2 2 0 011.6 2.2l-.6 4.7a3 3 0 01-3 2.6h-4.6a3 3 0 01-2.4-1.2L5 15.4a1.4 1.4 0 012-1.9L9 15z" fill="#fff" stroke="#231F20" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
};

function caption(t) {
  const c = P.captions.find(c => t >= c.s && t < c.e);
  if (!c || t >= P.end) return '';
  const k = back((t - c.s) / .14), s = .86 + .14 * k;
  const words = c.words.map(w => `<span class="${w.hot ? 'hot' : ''}">${w.w}</span>`).join(' ');
  return `<div class="cap" style="${t >= P.ctaAt ? 'top:1400px;' : ''}transform:scale(${s});opacity:${cl((t - c.s) / .06)}">${words}</div>`;
}

function personCard(x, who, status, ok, tAppear, t, extra = '') {
  const k = back((t - tAppear) / .3);
  if (t < tAppear) return '';
  const col = ok ? 'var(--aksen)' : 'var(--merah)';
  return `<div class="card" style="left:${x}px;top:960px;width:370px;transform:translateY(${(1 - k) * 40}px) scale(${.9 + .1 * k});opacity:${cl((t - tAppear) / .15)}">
    <div style="display:flex;align-items:center;gap:16px"><div class="ic" style="width:64px;height:64px">${svg.person('#fff')}</div>
    <div style="font-size:40px;font-weight:800">${who}</div></div>
    <div style="margin-top:18px;display:flex;align-items:center;gap:12px;font-size:38px;font-weight:700;color:${ok ? 'var(--biru)' : 'var(--merah)'}">
      <span style="display:flex;width:56px;height:56px;border-radius:50%;background:${col};align-items:center;justify-content:center">${ok ? svg.check('#fff', 36) : svg.cross('#fff', 36)}</span>${status}</div>${extra}</div>`;
}

const R = {
  thumb(g, t) {
    const L = g.lines;
    return `<div class="full" style="background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(20,26,60,.55) 62%,rgba(20,26,60,.75) 100%)"></div>
    <div class="abs" style="left:70px;top:1005px;width:840px;font-weight:900;font-size:128px;line-height:1.02;letter-spacing:-2px;color:#fff;-webkit-text-stroke:14px var(--hitam);paint-order:stroke fill">
      <div>${L[0]}</div><div>${L[1]}</div>
      <div style="display:inline-block;margin-top:14px;background:var(--aksen);color:#fff;-webkit-text-stroke:0;padding:6px 28px 12px;border-radius:18px">${L[2]}</div></div>`;
  },
  label(g, t) {
    const a = io(t, g, .3, .3);
    return `<div class="pill" style="left:60px;top:300px;background:rgba(42,59,143,.92);color:#fff;font-size:38px;padding:14px 30px;opacity:${a};transform:translateX(${(1 - eo((t - g.s) / .3)) * -40}px)">${g.text}</div>`;
  },
  versus(g, t) {
    const a = io(t, g, .2, .25);
    let q = '';
    if (t >= g.q) {
      const k = back((t - g.q) / .3);
      q = `<div class="abs" style="left:398px;top:1000px;width:124px;height:124px;border-radius:50%;background:var(--biru);color:#fff;font-weight:900;font-size:84px;display:flex;align-items:center;justify-content:center;transform:scale(${k});box-shadow:0 10px 30px rgba(0,0,0,.25);border:6px solid #fff">?</div>`;
    }
    return `<div style="opacity:${a}">${personCard(70, g.a[0], g.a[1], true, g.a[2], t)}${personCard(480, g.b[0], g.b[1], false, g.b[2], t)}${q}</div>`;
  },
  'versus-ok'(g, t) {
    const a = io(t, g, .2, .25);
    const card = (x, who, ta) => {
      if (t < ta) return '';
      const k = back((t - ta) / .3);
      return `<div class="card" style="left:${x}px;top:980px;width:370px;display:flex;align-items:center;gap:18px;transform:scale(${.85 + .15 * k})">
        <div class="ic" style="width:64px;height:64px">${svg.person('#fff')}</div><div style="font-size:38px;font-weight:800;flex:1;white-space:nowrap">${who}</div>
        <span style="display:flex;width:62px;height:62px;border-radius:50%;background:var(--aksen);align-items:center;justify-content:center">${svg.check('#fff', 40)}</span></div>`;
    };
    return `<div style="opacity:${a}">${card(70, g.a[0], g.a[2])}${card(480, g.b[0], g.b[2])}</div>`;
  },
  chip(g, t) {
    const a = io(t, g, .15, .2), k = back((t - g.s) / .3);
    return `<div class="chip" style="opacity:${a};transform:translateX(-50%) scale(${.8 + .2 * k})"><div class="ic">${svg[g.icon]}</div>${g.text}</div>`;
  },
  notfound(g, t) {
    const a = io(t, g, .15, .25), u = t - g.s;
    const x = 460 + Math.sin(u * 7) * 70 * cl(1 - u / .9);
    const ks = back((u - .55) / .3);
    return `<div style="opacity:${a}">
      <div class="abs" style="left:${x - 95}px;top:880px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))">${svg.mag}</div>
      ${u > .55 ? `<div class="chip" style="top:1090px;background:var(--merah);color:#fff;transform:translateX(-50%) scale(${.7 + .3 * ks})"><div class="ic" style="background:#fff">${svg.cross('#D9434B', 40)}</div>${g.text}</div>` : ''}</div>`;
  },
  'broll-book'(g, t) {
    const u = t - g.s, d = g.e - g.s, a = io(t, g, .2, .2);
    const months = ['JAN', 'FEB', 'MAC', 'APR', 'MEI', 'JUN', 'JUL', 'OGO', 'SEP', 'OKT'];
    const per = (d - .5) / months.length, i = cl(Math.floor((u - .25) / per), 0, months.length - 1);
    const f = cl(((u - .25) % per) / per);
    const page = (m, n) => `<div style="font-weight:800;font-size:40px;color:var(--biru);letter-spacing:2px">RESIT</div>
      <div style="font-size:26px;color:#777;margin-top:6px">No. ${String(n).padStart(4, '0')}</div>
      <div style="position:absolute;right:36px;top:30px;font-weight:900;font-size:56px;color:var(--aksen)">${m}</div>
      ${[0, 1, 2, 3, 4, 5].map(r => `<div style="height:3px;background:#d5d9e0;margin-top:${r ? 46 : 60}px"></div>`).join('')}
      <div style="position:absolute;left:36px;bottom:34px;font-size:26px;color:#999">Tandatangan: ________</div>`;
    const flip = i < months.length - 1 ? `<div style="position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 50%;transform:rotateY(${-170 * eio(f)}deg);backface-visibility:hidden;background:#fff;border-radius:6px 18px 18px 6px;padding:30px 36px;box-sizing:border-box;box-shadow:${f > 0 ? '-10px 0 30px rgba(0,0,0,.18)' : 'none'}">${page(months[i], 120 + i)}</div>` : '';
    return `<div class="full" style="opacity:${a};background:radial-gradient(circle at 50% 35%,#f4f5f7,#d9dce2)">
      <div class="abs" style="left:540px;top:820px;transform:translate(-50%,-50%) scale(${1 + .06 * u / d}) rotate(-3deg)">
        <div style="position:relative;width:640px;height:820px;perspective:1800px">
          <div style="position:absolute;left:-26px;top:16px;width:640px;height:820px;background:var(--biru);border-radius:12px 22px 22px 12px;box-shadow:0 30px 60px rgba(0,0,0,.28)"></div>
          ${[3, 2, 1].map(k => `<div style="position:absolute;left:${k * 4}px;top:${k * 4}px;width:640px;height:820px;background:#f3f1ea;border-radius:6px 18px 18px 6px"></div>`).join('')}
          <div style="position:absolute;inset:0;background:#fff;border-radius:6px 18px 18px 6px;padding:30px 36px;box-sizing:border-box">${page(months[Math.min(i + 1, months.length - 1)], 121 + i)}</div>
          ${flip}
        </div></div></div>`;
  },
  'broll-ledger'(g, t) {
    const u = t - g.s, d = g.e - g.s, a = io(t, g, .2, .2);
    const rows = 7, rowH = 92;
    let lines = '';
    for (let r = 0; r < rows; r++) {
      const st = .25 + r * .3, p = cl((u - st) / .35);
      const y = 640 + r * rowH;
      const blank = r === 4;
      lines += `<div class="abs" style="left:150px;top:${y}px;font:600 40px Inter;color:#3b4a8a;font-style:italic">${r + 1}.</div>`;
      if (!blank) {
        lines += `<svg class="abs" style="left:230px;top:${y - 6}px" width="460" height="60"><path d="M5 35 C 40 10, 70 50, 110 28 S 180 15, 220 34 S 300 50, 340 26 S 410 18, 450 32" fill="none" stroke="#2c3a7a" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/></svg>`;
        if (p >= 1) lines += `<div class="abs" style="left:770px;top:${y - 4}px;font:700 44px Inter;color:#2c3a7a">RM __</div>`;
      } else if (u > st + .2) {
        lines += `<div class="abs" style="left:420px;top:${y - 18}px;font:900 70px Inter;color:var(--merah);transform:scale(${back((u - st - .2) / .3)})">?</div>`;
      }
    }
    const pr = Math.min(Math.floor((u - .25) / .3), rows - 1), pp = cl(((u - .25) % .3) / .3);
    const penX = 230 + 450 * pp, penY = 640 + Math.max(pr, 0) * rowH - 60;
    return `<div class="full" style="opacity:${a};background:#ece8dd">
      <div class="abs" style="left:40px;top:430px;width:1000px;height:1100px;background:#fbf8f0;border-radius:10px;box-shadow:0 30px 70px rgba(0,0,0,.22);transform:rotate(-1deg) scale(${1.03 - .03 * u / d});
        background-image:repeating-linear-gradient(180deg,transparent 0 89px,#c7d3e6 89px 92px);background-position:0 ${640 - 430 + 62}px">
        <div style="position:absolute;left:100px;top:0;bottom:0;width:3px;background:#e7a0a0"></div>
        <div style="position:absolute;left:150px;top:70px;font:800 64px Inter;color:#2c3a7a;font-style:italic">Rekod Yuran</div>
      </div>
      ${lines}
      <div class="abs" style="left:${penX}px;top:${penY}px;width:24px;height:240px;background:linear-gradient(#2A3B8F,#1b275e);border-radius:12px 12px 4px 4px;transform:rotate(28deg);transform-origin:bottom center;box-shadow:6px 10px 20px rgba(0,0,0,.25)"></div>
      <div class="pill" style="left:540px;top:330px;transform:translateX(-50%);background:var(--hitam);color:#fff;font-size:44px;padding:16px 36px">REKOD MANUAL</div>
    </div>`;
  },
  logo(g, t) {
    const a = io(t, g, .2, .2), k = back((t - g.s) / .35);
    return `<div class="abs" style="left:480px;top:1040px;transform:translate(-50%,-50%) scale(${.85 + .15 * k});opacity:${a};background:var(--biru);border-radius:44px;padding:30px 60px">
      <img src="assets/logo_white.png" style="display:block;width:380px"></div>`;
  },
  'broll-screen'(g, t) {
    const u = t - g.s, d = g.e - g.s, a = io(t, g, .2, .2);
    const img = IMG[g.img], cw = 980, ch = 860;
    const s0 = Math.max(cw / img.w, ch / img.h), s1 = s0 * 1.6, k = eio((u - .3) / (d - .7));
    const s = s0 + (s1 - s0) * k;
    // titik fokus bergerak ke tengah kad
    const cx0 = img.w / 2, cy0 = img.h * .5, fx = cx0 + (g.focus[0] - cx0) * k, fy = cy0 + (g.focus[1] - cy0) * k;
    const tx = cw / 2 - fx * s, ty = ch / 2 - fy * s;
    const ra = cl((u - (d - .75)) / .2) * (1 - cl((u - d + .15) / .15)) + (u > .9 ? 1 : 0) * 0;
    const ring = u > .9 ? `<div class="abs" style="left:${cw / 2 - 90}px;top:${ch / 2 - 60}px;width:180px;height:120px;border:7px solid var(--aksen);border-radius:30px;transform:scale(${back((u - .9) / .3)});box-shadow:0 0 0 9999px rgba(20,26,60,${.25 * cl((u - .9) / .3)})"></div>` : '';
    return `<div class="full" style="opacity:${a};background:linear-gradient(160deg,#2A3B8F,#1c2865)">
      <div class="abs" style="left:50px;top:300px;width:${cw}px;height:${ch}px;border-radius:30px;overflow:hidden;background:#f3f5fa;box-shadow:0 30px 70px rgba(0,0,0,.35)">
        <img src="assets/${g.img}" style="position:absolute;left:0;top:0;width:${img.w}px;transform-origin:0 0;transform:translate(${tx}px,${ty}px) scale(${s})">${ring}</div>
      ${u > 1.0 ? `<div class="pill" style="left:540px;top:190px;transform:translateX(-50%) scale(${back((u - 1) / .3)});background:var(--aksen);color:#fff;font-size:44px;padding:16px 36px">${g.callout}</div>` : ''}
    </div>`;
  },
  'broll-receipt'(g, t) {
    const u = t - g.s, a = io(t, g, .2, .2), tf = (g.ding - g.s);
    const fly = eio((u - .3) / (tf - .5));
    const rx = -420 + (540 - -420) * fly, ry = 760 - 40 * Math.sin(fly * Math.PI), rs = 1 - .55 * fly, rr = -12 + 12 * fly;
    const notif = u > tf ? `<div class="abs" style="left:24px;right:24px;top:150px;background:#fff;border-radius:22px;padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.2);transform:translateY(${(1 - back((u - tf) / .3)) * -40}px)">
        <span style="display:flex;width:60px;height:60px;border-radius:50%;background:var(--aksen);align-items:center;justify-content:center;flex:none">${svg.check('#fff', 38)}</span>
        <div style="font:800 34px Inter;color:var(--hitam)">Resit diterima</div></div>` : '';
    return `<div class="full" style="opacity:${a};background:radial-gradient(circle at 50% 40%,#3a4fb0,#1c2865 75%)">
      <div class="abs" style="left:310px;top:330px;width:460px;height:900px;border-radius:64px;background:#111;padding:18px;box-sizing:border-box;box-shadow:0 40px 80px rgba(0,0,0,.45)">
        <div style="position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--kelabu)">
          <div style="background:var(--biru);height:120px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px;box-sizing:border-box"><img src="assets/logo_white.png" style="width:150px"></div>
          ${[0, 1, 2, 3].map(r => `<div style="margin:${r ? 18 : 140}px 28px 0;height:90px;background:#fff;border-radius:18px"></div>`).join('')}
          ${notif}
        </div></div>
      ${fly < 1 ? `<div class="abs" style="left:${rx - 170}px;top:${ry - 220}px;width:340px;height:440px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);padding:28px;box-sizing:border-box;transform:scale(${rs}) rotate(${rr}deg);opacity:${1 - cl((fly - .85) / .15)}">
        <div style="font:800 40px Inter;color:var(--biru);letter-spacing:2px">RESIT</div>
        ${[0, 1, 2, 3].map(r => `<div style="height:10px;border-radius:5px;background:#dfe3ea;margin-top:${r ? 22 : 34}px;width:${[90, 70, 80, 55][r]}%"></div>`).join('')}
        <div style="position:absolute;right:26px;bottom:26px;width:84px;height:84px;border-radius:50%;background:var(--aksen);display:flex;align-items:center;justify-content:center">${svg.check('#fff', 52)}</div></div>` : ''}
      <div class="pill" style="left:540px;top:190px;transform:translateX(-50%);background:var(--aksen);color:#fff;font-size:44px;padding:16px 36px;opacity:${cl((u - .2) / .25)}">Resit automatik</div>
    </div>`;
  },
  'broll-search'(g, t) {
    // meja atas: slip resit bertaburan, kanta menyapu, cop TAK JUMPA
    const u = t - g.s, d = g.e - g.s, a = io(t, g, .18, .2), ts = g.stamp - g.s;
    const slips = [[170, 520, -14, 'JAN'], [560, 470, 9, 'MAC'], [300, 820, 6, 'MEI'], [690, 800, -8, 'JUL'], [140, 1120, 12, 'OGO'], [560, 1130, -5, 'SEP'], [380, 1420, -11, 'FEB'], [770, 1400, 7, 'JUN']];
    const slip = ([x, y, r, m], i) => `<div class="abs" style="left:${x}px;top:${y}px;width:300px;height:220px;background:#fff;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.16);transform:rotate(${r}deg);padding:22px 24px;box-sizing:border-box">
      <div style="display:flex;justify-content:space-between;font:800 28px Inter;color:var(--biru);letter-spacing:1px">RESIT<span style="color:var(--aksen)">${m}</span></div>
      ${[0, 1, 2].map(k => `<div style="height:8px;border-radius:4px;background:#e1e4ea;margin-top:${k ? 18 : 26}px;width:${[88, 64, 76][k]}%"></div>`).join('')}</div>`;
    const p = eio(u / Math.max(ts, .3));
    const mx = 470 + Math.sin(p * Math.PI * 2.2) * 300, my = 640 + p * 600;
    const ks = back((u - ts) / .3);
    return `<div class="full" style="opacity:${a};background:radial-gradient(circle at 50% 45%,#f1f2f4,#d5d8de)">
      <div class="full" style="transform:scale(${1.04 + .05 * u / d});transform-origin:50% 50%">${slips.map(slip).join('')}</div>
      <div class="abs" style="left:${mx - 120}px;top:${my - 120}px;width:240px;height:240px;border-radius:50%;border:16px solid var(--hitam);box-sizing:border-box;background:rgba(41,171,226,.12);box-shadow:0 18px 30px rgba(0,0,0,.25);opacity:${u < ts + .1 ? 1 : 1 - cl((u - ts - .1) / .2)}">
        <div style="position:absolute;left:182px;top:182px;width:34px;height:140px;background:var(--hitam);border-radius:14px;transform:rotate(-45deg);transform-origin:top center"></div></div>
      ${u >= ts ? `<div class="abs" style="left:480px;top:1000px;transform:translate(-50%,-50%) rotate(-8deg) scale(${1.4 - .4 * ks});opacity:${cl((u - ts) / .1)};border:12px solid var(--merah);border-radius:22px;padding:14px 40px;color:var(--merah);font:900 104px Inter;letter-spacing:4px;white-space:nowrap;background:rgba(255,255,255,.88)">${g.text}</div>` : ''}
    </div>`;
  },
  callout(g, t) {
    const a = io(t, g, .15, .2);
    return `<div class="pill" style="left:540px;top:190px;transform:translateX(-50%) scale(${back((t - g.s) / .3)});opacity:${a};background:var(--aksen);color:#fff;font-size:44px;padding:16px 36px">${g.text}</div>`;
  },
  'broll-video'() { return ''; },
  'cta-bio'(g, t) {
    const u = t - g.s, a = io(t, g, .2, .01);
    const W = 880, H = Math.round(W * 238 / 687), sx = W / 687;
    const lx = 330 * sx, ly = 212 * sx;                      // pautan "yuran.my/daftar/?tiktok"
    const tp = g.tap - g.s, m = eio(u / tp);
    const hx = 800 + (lx - 800 + 40) * m, hy = 380 + (ly - 380 + 30) * m;
    const rip = u > tp ? cl((u - tp) / .5) : 0;
    return `<div style="opacity:${a}">
      <div class="pill" style="left:480px;top:830px;transform:translateX(-50%) scale(${back(u / .3)});background:var(--aksen);color:#fff;font-size:50px;padding:18px 40px">Klik link di bio</div>
      <div class="abs" style="left:40px;top:950px;width:${W}px;height:${H}px;border-radius:28px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);transform:translateY(${(1 - eo(u / .3)) * 50}px)">
        <img src="assets/tiktok_profil.jpg" style="width:${W}px;display:block">
        ${rip ? `<div class="abs" style="left:${lx - 60 - 140 * rip}px;top:${ly - 140 * rip}px;width:${120 + 280 * rip}px;height:${280 * rip}px;margin-top:-${0}px;border-radius:50%;border:6px solid rgba(41,171,226,${1 - rip})"></div>
        <div class="abs" style="left:${140 * sx}px;top:${200 * sx}px;width:${300 * sx}px;height:${28 * sx}px;border-radius:10px;background:rgba(41,171,226,.28)"></div>` : ''}
      </div>
      <div class="abs" style="left:${40 + hx}px;top:${950 + hy}px;opacity:${cl(u / .2)};transform:scale(${u > tp && u < tp + .15 ? .88 : 1})">${svg.hand}</div></div>`;
  },
  endcard(g, t) {
    const u = t - g.s, k = eo(u / .35);
    const W = 760, H = Math.round(W * 238 / 687), sx = W / 687, rip = (u % .75) / .75;
    return `<div class="full" style="background:linear-gradient(170deg,#2A3B8F,#1d2a6e)">
      <div class="abs" style="left:500px;top:330px;transform:translateX(-50%) translateY(${(1 - k) * 30}px);opacity:${k};padding:40px"><img src="assets/logo_white.png" style="width:460px;display:block"></div>
      <div class="abs" style="left:500px;top:690px;transform:translateX(-50%);color:#fff;font:800 66px Inter;white-space:nowrap;opacity:${eo((u - .1) / .3)}">Cara <span style="color:var(--aksen)">MUDAH</span> Urus Yuran</div>
      <div class="pill" style="left:500px;top:850px;transform:translateX(-50%) scale(${back((u - .2) / .3)});background:var(--aksen);color:#fff;font-size:48px;padding:16px 40px">Klik link di bio</div>
      <div class="abs" style="left:${500 - W / 2}px;top:980px;width:${W}px;height:${H}px;border-radius:24px;overflow:hidden;opacity:${eo((u - .25) / .3)};box-shadow:0 20px 50px rgba(0,0,0,.35)">
        <img src="assets/tiktok_profil.jpg" style="width:${W}px;display:block">
        <div class="abs" style="left:${140 * sx}px;top:${200 * sx}px;width:${300 * sx}px;height:${28 * sx}px;border-radius:10px;border:4px solid rgba(41,171,226,${1 - rip});transform:scale(${1 + .15 * rip})"></div></div>
      <div class="abs" style="left:500px;top:1330px;transform:translateX(-50%);color:#fff;font:700 50px Inter;opacity:${eo((u - .35) / .3)}">hello@yuran.my</div>
    </div>`;
  },
};

const IMG = {};
window.ready = Promise.all(['scr_invois.png', 'scr_dashboard.png', 'logo_white.png', 'tiktok_profil.jpg'].map(n => new Promise(r => {
  const i = new Image(); i.onload = () => { IMG[n] = { w: i.naturalWidth, h: i.naturalHeight }; r(); }; i.src = 'assets/' + n;
}))).then(() => document.fonts.ready);

window.render = function (t) {
  let h = '';
    for (const g of P.graphics) if (t >= g.s && t < g.e) h += R[g.kind](g, t);
  if (t >= 1 - 1e-6) h += caption(t);
  S.innerHTML = h;
};

<!doctype html>
<meta charset="utf-8">
<!-- AT001 cover/thumbnail, 1080x1920. Target market ("Tahun 4 & 5") is the biggest line, the problem sits under it,
     whole block centred on the 3:4 profile-grid crop (y 240–1680); it may overlap the face. Rendered with Playwright. -->
<link rel="stylesheet" href="fonts/local.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0f1d44}
.f{position:absolute;inset:0;overflow:hidden}
.f img{position:absolute;left:0;top:0;width:1080px;height:2000px;object-fit:cover;object-position:50% 100%}
.shade{position:absolute;inset:0;background:radial-gradient(75% 38% at 50% 50%,rgba(8,14,36,.72),rgba(8,14,36,.35) 70%,rgba(8,14,36,.2))}
.blk{position:absolute;left:40px;right:40px;top:50%;transform:translateY(-54%);display:flex;flex-direction:column;align-items:center;text-align:center;font-family:Archivo,sans-serif;color:#fff}
.k{font-weight:900;font-stretch:75%;font-size:110px;line-height:.9;letter-spacing:.02em;text-shadow:0 8px 0 rgba(0,0,0,.4)}
.tgt{margin-top:10px;font-weight:900;font-stretch:66%;font-size:205px;line-height:.86;background:#ffc83d;color:#0f1d44;padding:16px 44px 4px;border-radius:28px;transform:rotate(-3deg);white-space:nowrap;box-shadow:0 16px 0 #b88400,0 30px 60px rgba(0,0,0,.5)}
.iss{margin-top:56px;font-weight:900;font-stretch:72%;font-size:122px;line-height:.95;text-shadow:0 7px 0 rgba(0,0,0,.45),0 0 40px rgba(0,0,0,.5)}
.iss b{display:inline-block;background:#e8392f;color:#fff;padding:2px 22px 0;border-radius:16px;transform:rotate(2deg);margin-top:10px}
.note{position:absolute;right:40px;top:300px;width:290px;padding:18px 24px 22px;background:#fbf8ef;border-radius:18px;transform:rotate(6deg);box-shadow:0 18px 40px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 53px,#b9cbe8 53px 55px);font-family:"Gochi Hand",cursive;color:#1f3f9e}
.note .q{font-size:82px;line-height:1.1;white-space:nowrap}
.note .q b{color:#e8392f;font-weight:400}
.note .c{display:flex;gap:9px;margin-top:4px}
.note .c i{font-style:normal;width:44px;height:44px;border-radius:50%;background:#ffc83d;color:#0f1d44;display:grid;place-items:center;font:900 26px Archivo,sans-serif}
.note .c i.x{background:#e8392f;color:#fff}
.cta{position:absolute;left:0;right:0;top:1500px;text-align:center}
.cta span{display:inline-block;font:900 66px Archivo,sans-serif;font-stretch:80%;color:#fff;background:rgba(15,29,68,.92);border:6px solid #ffc83d;border-radius:999px;padding:10px 40px 12px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
</style>
<div class="f">
  <img src="frame.png" alt="">
  <div class="shade"></div>
  <div class="blk">
    <div class="k">ANAK</div>
    <div class="tgt">TAHUN 4 &amp; 5</div>
    <div class="iss">MASIH KIRA<br><b>GUNA JARI?</b></div>
  </div>
  <div class="cta"><span>Bukan salah anak 👇</span></div>
  <div class="note"><div class="q">7×8 = <b>?</b></div><div class="c"><i>1</i><i>2</i><i>3</i><i>4</i><i class="x">…</i></div></div>
</div>

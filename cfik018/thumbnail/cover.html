<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Source+Sans+3:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{background:#111}
.c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Jost,sans-serif;color:#fff;background:#1a1512}
.c .spk{position:absolute;left:-60px;width:1200px;height:auto;filter:contrast(1.04) saturate(1.02)}

/* ---- B ---- */
#B .spk{top:-40px;left:-140px;width:1360px}

#B .logo{left:50%;transform:translateX(-50%)}
#B .top{position:absolute;top:290px;left:64px;right:64px;text-align:center}

<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@600;700;800&family=Kalam:wght@700&display=swap">
<style>
:root{--yel:#ffd800;--red:#eb0a1e;--ink:#111216;--green:#16a862;--marker:#b0177f;--board:#fbfbf8}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
.bg{position:absolute;left:-50px;top:0;width:1180px}
.shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35) 0,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 40%,rgba(8,8,10,.78) 56%,rgba(8,8,10,.86) 100%)}
.tag{position:absolute;left:64px;top:270px;display:flex;gap:16px;align-items:center}
.tag b{font:900 46px/1 "Archivo";font-stretch:80%;background:var(--red);color:#fff;padding:14px 26px;border-radius:14px;letter-spacing:.04em;transform:rotate(-3deg)}
.tag span{font:800 34px/1 "Figtree";color:#fff;background:rgba(0,0,0,.6);padding:14px 22px;border-radius:99px}
.head{position:absolute;left:64px;right:56px;top:880px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.head .w{font:900 104px/0.92 "Archivo";font-stretch:70%;color:#fff;text-transform:uppercase;text-shadow:0 6px 0 rgba(0,0,0,.5)}
.head .y{white-space:nowrap;font:900 92px/0.95 "Archivo";font-stretch:68%;color:var(--ink);background:var(--yel);padding:8px 26px 14px;text-transform:uppercase;transform:rotate(-1.5deg);box-shadow:0 10px 0 rgba(0,0,0,.35)}
.head .s{font:800 44px/1.15 "Figtree";color:var(--yel);margin-top:10px}
.board{position:absolute;left:64px;right:64px;top:1330px;height:340px;background:var(--board);border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.eq{position:absolute;left:30px;right:30px;top:26px;height:96px;background:#eef0f6;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:22px;font:700 76px/1 "Kalam";color:var(--ink)}
.eq u{text-decoration:none;display:inline-grid;place-items:center;width:88px;height:74px;border:8px solid var(--marker);border-radius:14px;font-size:56px;color:var(--green)}
.brand{position:absolute;left:0;right:0;top:1700px;text-align:center;font:800 30px/1 "Figtree";letter-spacing:.14em;color:#fff;text-transform:uppercase;opacity:.9}
.brand i{font-style:normal;color:var(--yel)}
.ab{position:absolute;left:30px;right:30px;bottom:30px;display:flex;gap:22px;align-items:center}
.ab div{flex:1;text-align:center;font:900 70px/1 "Archivo";font-stretch:80%;padding:22px 0;border-radius:22px;background:var(--ink);color:#fff}
.ab div b{color:var(--yel)}
.ab em{font:900 130px/1 "Archivo";color:var(--red);font-style:normal;margin:-20px 0}
svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ans{position:absolute;left:400px;top:222px;background:var(--green);color:#fff;font:900 68px/1 "Archivo";font-stretch:78%;padding:14px 28px;border-radius:22px;transform:rotate(-4deg);box-shadow:0 8px 0 #0c6b3d}
.num{font:700 40px "Kalam";fill:#138a52}
</style>
<img class="bg" id="bg">
<div class="shade"></div>
<div class="tag"><b id="part"></b><span id="sub"></span></div>
<div class="head" id="head"></div>
<div class="board" id="board"></div>
<div class="brand"><i>Aster Edu</i> · Tuisyen Online</div>
<script>
const v=new URLSearchParams(location.search).get("v");
const $=s=>document.querySelector(s);
$("#bg").src=`bg${v}.png`;
if(v==="1"){
 $("#part").textContent="PART 1";$("#sub").textContent="Soalan UASA · Darjah 4–6";
 $("#head").innerHTML=`<div class="w">Anak tahu tambah</div><div class="w">&amp; tolak…</div><div class="y">Tapi tak boleh jawab?</div>`;
 $("#board").innerHTML=`<div class="eq">6 965 − <u></u> = 6 608</div><div class="ab"><div><b>A</b> TAMBAH</div><em>?</em><div><b>B</b> TOLAK</div></div>`;
}else{
 $("#part").textContent="PART 2";$("#sub").textContent="Jawapan + teknik penuh";
 $("#head").innerHTML=`<div class="w">Teknik</div><div class="y">Belon Adudu</div><div class="s">Anak terus tahu nak tambah atau tolak</div>`;
 $("#board").innerHTML=`<svg viewBox="0 0 952 340"><g fill="none" stroke-linecap="round">
   <path d="M150 128 L92 238 M210 128 L268 238" stroke="#111216" stroke-width="6"/><path d="M118 270 L242 270" stroke="#111216" stroke-width="6"/>
   <circle cx="180" cy="92" r="52" stroke="#b0177f" stroke-width="8"/><circle cx="82" cy="270" r="52" stroke="#b0177f" stroke-width="8"/><circle cx="278" cy="270" r="52" stroke="#b0177f" stroke-width="8"/>
   <path d="M210 128 L268 238" stroke="#ffd800" stroke-width="22" opacity=".8"/><path d="M210 128 L268 238" stroke="#111216" stroke-width="6"/></g>
   <text x="180" y="105" text-anchor="middle" class="num">6965</text><text x="278" y="283" text-anchor="middle" class="num">6608</text>
   <rect x="58" y="248" width="48" height="44" rx="8" fill="#c8f0b8" stroke="#111216" stroke-width="5"/><circle cx="72" cy="266" r="5" fill="#111216"/><circle cx="92" cy="266" r="5" fill="#111216"/>
   <text x="70" y="190" font-family="Kalam" font-weight="700" font-size="70" fill="#111216">−</text><text x="258" y="190" font-family="Kalam" font-weight="700" font-size="70" fill="#eb0a1e">−</text>
   <text x="430" y="108" font-family="Kalam" font-weight="700" font-size="84" fill="#111216">6965</text><text x="402" y="190" font-family="Kalam" font-weight="700" font-size="84" fill="#111216">− 6608</text>
   <path d="M402 214 L650 214" stroke="#111216" stroke-width="7" stroke-linecap="round"/></svg><div class="ans">= 357 ✓</div>`;
}
</script>
